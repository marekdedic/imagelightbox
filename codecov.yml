---
coverage:
  range: "95...100"

  status:
    project:
      default:
        target: auto
        threshold: 5%
    patch:
      default:
        target: 90%

parsers:
  gcov:
    branch_detection:
      conditional: true
      loop: true
      method: false
      macro: false

comment:
  layout: "reach,diff,flags,files"
  require_changes: false
