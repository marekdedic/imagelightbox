<!doctype html>
<html>
<head>
    <title>Imagelightbox test fixtures</title>
    <meta charset='utf-8'>
    <script type="module" src="./fixtures.ts"></script>
</head>

<body>
<!--
    Test fixtures that would be noise in the docs page. This page is only served
    by the dev server - it is not part of the built docs. Galleries here get a
    data-testid matching their data-imagelightbox value.
-->
<h1>Imagelightbox test fixtures</h1>

<section>
    <h2>Keyboard navigation disabled</h2>
    <ul data-testid="no-keyboard">
        <li><a href="images/demo1.jpg" data-imagelightbox="no-keyboard"><img src="images/thumb1.jpg"></a></li>
        <li><a href="images/demo2.jpg" data-imagelightbox="no-keyboard"><img src="images/thumb2.jpg"></a></li>
        <li><a href="images/demo3.jpg" data-imagelightbox="no-keyboard"><img src="images/thumb3.jpg"></a></li>
    </ul>
</section>

<section>
    <h2>Navigation with dynamically added images</h2>
    <ul class="demo_dynamic_navigation" data-testid="dynamic-navigation">
        <li><a href="images/demo1.jpg" data-imagelightbox="dynamic-navigation"><img src="images/thumb1.jpg"></a></li>
        <li><a href="images/demo2.jpg" data-imagelightbox="dynamic-navigation"><img src="images/thumb2.jpg"></a></li>
    </ul>
    <button class="add_image_navigation">Add image to the navigation gallery</button>
</section>

<section>
    <h2>Autoplaying video</h2>
    <ul data-testid="autoplay-video">
        <li><a data-ilb2-video='{"controls":"controls", "autoplay":true, "muted":"muted", "sources":[{"src":"images/video.m4v", "type":"video/mp4"}]}' data-imagelightbox="autoplay-video"><img src="images/video-thumb.jpg"></a></li>
    </ul>
</section>

<section>
    <h2>Programmatic control</h2>
    <ul data-testid="programmatic">
        <li><a href="images/demo1.jpg" data-imagelightbox="programmatic"><img src="images/thumb1.jpg"></a></li>
        <li><a href="images/demo2.jpg" data-imagelightbox="programmatic"><img src="images/thumb2.jpg"></a></li>
        <li><a href="images/demo3.jpg" data-imagelightbox="programmatic"><img src="images/thumb3.jpg"></a></li>
    </ul>
    <button class="programmatic_open">Open</button>
    <button class="programmatic_open_third">Open the third image</button>
    <button class="programmatic_open_foreign">Open a foreign image</button>
    <button class="programmatic_previous">Previous</button>
    <button class="programmatic_next">Next</button>
    <button class="programmatic_close">Close</button>
</section>

<section>
    <h2>Caption with nothing to fall back on</h2>
    <ul data-testid="caption-fallback">
        <li><a href="images/demo1.jpg" data-imagelightbox="caption-fallback" data-ilb2-caption="A caption"><img src="images/thumb1.jpg"></a></li>
        <li><a href="images/demo2.jpg" data-imagelightbox="caption-fallback">A link with no image inside it</a></li>
    </ul>
</section>
</body>
</html>
